        html, body {

        .glass-pill {

            width: 100%;
            height: auto;
            margin: 0;
            padding: 0;
            vertical-align: bottom;

        @keyframes pulseGlow {
            0%, 100% { 
                filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.9)) drop-shadow(0 0 25px rgba(212, 175, 55, 0.5)); 
                transform: scale(1); 
            }
            50% { 
                filter: drop-shadow(0 0 22px rgba(255, 215, 0, 1)) drop-shadow(0 0 40px rgba(212, 175, 55, 0.8)); 
                transform: scale(1.06); 
            }
        }

        .wax-seal-img { 
            animation: pulseGlow 2.5s infinite ease-in-out; 
            cursor: pointer; 
            transition: transform 0.2s ease; 
        }

        .wax-seal-img:active { 
            transform: scale(0.92) !important; 
        }

        body.locked { 
            overflow: hidden; 
            height: 100vh; 
        }

        /* Scroll animation classes for photo gallery */
        .photo-card {
            opacity: 0;
            transform: translateY(30px) scale(0.95);

        .photo-card.reveal {

                        <!-- Hours Circle -->
                        <div class="flex flex-col items-center">
                            <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-black/40 border-2 border-[#D4AF37]/70 flex items-center justify-center shadow-lg backdrop-blur-md">
                                <span id="countdownHours" class="text-lg sm:text-2xl font-bold font-serif" style="color: #D4AF37;">00</span>
                            </div>
                            <span class="text-[10px] sm:text-xs font-semibold text-white uppercase tracking-wider mt-2 drop-shadow">Hs</span>
                        </div>
                        <!-- Minutes Circle -->
                        <div class="flex flex-col items-center">
                            <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-black/40 border-2 border-[#D4AF37]/70 flex items-center justify-center shadow-lg backdrop-blur-md">
                                <span id="countdownMinutes" class="text-lg sm:text-2xl font-bold font-serif" style="color: #D4AF37;">00</span>
                            </div>
                            <span class="text-[10px] sm:text-xs font-semibold text-white uppercase tracking-wider mt-2 drop-shadow">Min</span>
                        </div>
                        <!-- Seconds Circle -->
                        <div class="flex flex-col items-center">
                            <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-black/40 border-2 border-[#D4AF37]/70 flex items-center justify-center shadow-lg backdrop-blur-md">
                                <span id="countdownSeconds" class="text-lg sm:text-2xl font-bold font-serif" style="color: #D4AF37;">00</span>
                            </div>
                            <span class="text-[10px] sm:text-xs font-semibold text-white uppercase tracking-wider mt-2 drop-shadow">Seg</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const audio = document.getElementById('bgMusic');
        let isPlaying = false;

        function scrollGallery(direction) {
            const slider = document.getElementById('gallerySlider');
            if (!slider) return;
            const scrollAmount = slider.clientWidth * 0.85;
            slider.scrollBy({
                left: direction * scrollAmount,
                behavior: 'smooth'
            });
        }

        // Countdown Timer Logic
        function updateCountdown() {
            const targetDate = new Date('2026-08-22T18:00:00');
            const now = new Date();
            const difference = targetDate - now;

            const daysElem = document.getElementById('countdownDays');
            const hoursElem = document.getElementById('countdownHours');
            const minutesElem = document.getElementById('countdownMinutes');
            const secondsElem = document.getElementById('countdownSeconds');

            if (!daysElem || !hoursElem || !minutesElem || !secondsElem) return;

            if (difference <= 0) {
                daysElem.textContent = '00';
                hoursElem.textContent = '00';
                minutesElem.textContent = '00';
                secondsElem.textContent = '00';
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            daysElem.textContent = String(days).padStart(2, '0');
            hoursElem.textContent = String(hours).padStart(2, '0');
            minutesElem.textContent = String(minutes).padStart(2, '0');
            secondsElem.textContent = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        function updateMusicIcon(active) {
            const icon = document.getElementById('musicIcon');
            if (icon) {
                icon.className = active 
                    ? "fas fa-volume-up text-lg text-amber-600 animate-pulse" 
                    : "fas fa-music text-lg text-amber-600";
            }
        }

        function openInvitation() {
            try {
                // Unlock body scrolling
                document.body.classList.remove('locked');

                // Fade out envelope overlay
                const overlay = document.getElementById('envelopeOverlay');
                overlay.classList.add('opacity-0', 'pointer-events-none');

                // Reveal main invitation images
                const main = document.getElementById('mainInvitation');
                main.classList.remove('opacity-0');
                main.classList.add('opacity-100');

                // Play audio starting at 5 seconds
                if (audio) {
                    audio.currentTime = 5;
                    const playPromise = audio.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            isPlaying = true;
                            updateMusicIcon(true);
                        }).catch(e => {
                            console.log("Autoplay requires direct gesture:", e);
                            isPlaying = false;
                            updateMusicIcon(false);
                        });
                    }
                }

                // Remove envelope overlay completely after fade transition
                setTimeout(() => {
                    overlay.style.display = 'none';
                    initScrollObserver();
                }, 1000);

            } catch (err) {
                console.error("Error opening invitation:", err);
            }
        }

        function toggleAudio() {
            if (!audio) return;
            
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                updateMusicIcon(false);
            } else {
                if (audio.currentTime < 5) {
                    audio.currentTime = 5;
                }
                audio.play().then(() => {
                    isPlaying = true;
                    updateMusicIcon(true);
                }).catch(e => console.log("Audio play error:", e));
            }
        }

        function initScrollObserver() {
            const photoCards = document.querySelectorAll('.photo-card');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('reveal');
                    }
                });
            }, {
                threshold: 0.15
            });

            photoCards.forEach(card => observer.observe(card));
        }

        const canvas = document.getElementById('sparklesCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        let particles = [];

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        if (canvas && ctx) {
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2.2 + 0.6;
                    this.speedY = -(Math.random() * 0.4 + 0.1);
                    this.opacity = Math.random();
                    this.fade = Math.random() * 0.008 + 0.003;
                }
                update() {
                    this.y += this.speedY;
                    this.opacity -= this.fade;
                    if (this.opacity <= 0 || this.y < 0) {
                        this.reset();
                        this.y = canvas.height + 10;
                        this.opacity = 1;
                    }
                }
                draw() {
                    ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity * 0.85})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            for (let i = 0; i < 45; i++) {
                particles.push(new Particle());
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animateParticles);
            }

            animateParticles();
        }
    </script>
</body>
</html>
